name: Build TrollStore IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build IPA
        run: bash scripts/package-ipa.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-TrollStore
          path: build/Calculator.ipa
